[project]
name = "keyla-mcp"
version = "0.1.0"
description = "MCP server for Keila API - comprehensive campaign and contact management"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.9.1",
    "requests>=2.32.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.12",
]

[project.scripts]
keyla-mcp = "src.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
