[project]
name = "keila-mcp"
version = "0.1.1"
description = "MCP server for Keila API - comprehensive campaign and contact management"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.9.1",
    "requests>=2.32.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.12",
]

[project.scripts]
keila-mcp = "keila_mcp.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["keila_mcp/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
